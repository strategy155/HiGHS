# Spack environment for HiPO benchmarks on CSCS Eiger
#
# Reference:
#   Spack: https://spack.readthedocs.io/en/latest/environments.html
#   CSCS:  https://eth-cscs.github.io/alps-uenv/tutorial-spack/

spack:

  # Root packages to install
  # CSCS recommends single root spec with constraints in packages: section
  specs:
    - intel-oneapi-mkl

  # Disable automatic filesystem view creation
  # CSCS pattern: view is managed via activation script generated by uenv-spack
  # Reference: https://docs.cscs.ch/build-install/uenv/
  view: false

  # Dependency resolution strategy
  # unify: true ensures all specs share single versions of dependencies
  # This is the Spack default and recommended for single-purpose environments
  concretizer:
    unify: true
